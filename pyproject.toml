[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immi-torch"
version = "0.1.0"
description = "A minimal deep learning framework built from scratch for educational purposes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["deep learning", "neural networks", "machine learning", "educational"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
numpy = [
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/ashwin-r11/Immi-Torch"
Documentation = "https://github.com/ashwin-r11/Immi-Torch#readme"
Repository = "https://github.com/ashwin-r11/Immi-Torch"
Issues = "https://github.com/ashwin-r11/Immi-Torch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["immi_torch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP"]
ignore = []

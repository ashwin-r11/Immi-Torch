name: Immi-Torch CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tensor-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install package + test deps
      run: |
        python -m pip install --upgrade pip
        pip install .[dev,numpy]

    - name: Run tensor unit tests
      run: |
        pytest tests/tier1_foundation/test_tensor.py -v
